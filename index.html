<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        CarFly
    </title>
    <link rel="icon" href="data:,">
    <style>
        button {
            cursor: pointer;
            background-color: #e90d0d;
            border: 3px solid #000000;
            color: #000000;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border-radius: 10px;
            position: absolute;
            z-index: 99;
            padding: 5px 10px;
            font-size: 15px;
            top: 10px;
            margin: 10;
            text-shadow: 0 0 3px #ffffff, 0 0 5px #ffffff;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .buttonInicio {
            padding: 15px 30px;
            font-size: 20px;
            left: 870px;
            top: 700px;
            margin: 0;
            top: 70%;
            left: 51%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }

        .buttonCamaras {
            left: 1300px;
            display: none;
        }

        .buttonLuzAmbient {
            left: 1430px;
            display: none;
        }

        .buttonLuzDirectional {
            left: 1650px;
            display: none;
        }

        .pontuacao {
            position: absolute;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-transform: uppercase;
            color: #e90d0d;
            text-shadow: 0 0 3px #000000;
            font-size: 40px;
            width: 200;
            height: 200;
            top: 100px;
            left: 200px;
        }

        body {
            width: auto;
            height: auto;
            margin: 0;
            padding: 0;
            background: -webkit-linear-gradient(#87CEEB, #ffffff);
            background: linear-gradient(#87CEEB, #ffffff);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #logo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .controlos { position: fixed; top: 10px; right: 10px; left: 10px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; z-index: 99; }
        .controlos button { position: static; margin: 0; font-size: clamp(11px, 1.3vw, 15px); }
        .pontuacao { top: 90px; left: 20px; font-size: clamp(24px, 4vw, 40px); }
        [hidden] { display: none !important; }
        #avisoPausa { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 90; color: white; background: #0005; font: bold 36px Arial, sans-serif; text-shadow: 0 2px 5px #000; }
        @media (max-width: 500px) { .pontuacao { top: 135px; } .controlos { gap: 5px; } }
    </style>

    <script src="vendor/inflate.min.js"></script>
    <script src="vendor/three.js"></script>
    <script src="vendor/FBXLoader.js"></script>
    <script src="vendor/fflate.min.js"></script>


    <script src="src/car.js"></script>
    <script src="src/smoke.js"></script>
    <script src="src/clouds.js"></script>
    <script src="src/sign.js"></script>
    <script src="src/coin.js"></script>
    <script src="src/input.js"></script>
    <script src="src/collision.js"></script>
    <script src="src/app.js"></script>
</head>

<body>
    <img src="assets/images/road.jpg" id="logo">
    <button id="botaoJogar" type="button" class="buttonInicio" onclick="init()">Jogar</button>
    <div id="avisoPausa" hidden>Em pausa</div>
    <div class="controlos">
    <button id="botaoPausa" type="button" onclick="alternarPausa()" aria-pressed="false" hidden>Pausar</button>
    <button id="botaoAlterarCamara" type="button" class="buttonCamaras" onclick="createCamaras()">Alterar
        Câmara</button>
    <button id="botaoLuzAmbient" type="button" class="buttonLuzAmbient" onclick="createAmbientLight()">Ligar/Desligar
        AmbientLight</button>
    <button id="botaoLuzDirectional" type="button" class="buttonLuzDirectional"
        onclick="createDirectionalLight()">Ligar/Desligar DirectionalLight</button>
    </div>
    <div id="pontuacao" class="pontuacao"></div>
</body>

</html>
